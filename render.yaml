services:
  # === твой FastAPI ===
  - type: web
    name: my-fastapi
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter
    autoDeploy: true
    envVars:
      - key: KROKI_URL
        value: https://my-kroki.onrender.com     # сюда FastAPI пошлет PlantUML
      - key: KROKI_BPMN_FALLBACK
        value: https://kroki.io                  # BPMN берем отсюда (временно)

  # === Kroki gateway (публичный, только PlantUML GET/POST) ===
  - type: web
    name: my-kroki
    env: docker
    docker:
      image: yuzutech/kroki
    plan: starter
    autoDeploy: true
    ports:
      - port: 8000
        protocol: tcp
    envVars:
      - key: KROKI_SAFE_MODE
        value: UNSAFE          # включает GET-ссылки /plantuml/png/<encoded>
